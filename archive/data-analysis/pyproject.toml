[project]
name = "dcft-campaign-analysis"
version = "0.2.0"
description = "Campaign and finite-size-scaling analysis for decohered-CFT Monte Carlo data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
]

[project.scripts]
dcft-analyze-campaign = "dcft_analysis.cli:main"
dcft-analyze-scaling = "dcft_analysis.scaling_cli:main"
dcft-compare-small = "dcft_analysis.comparison:main"
dcft-compare-measurements = "dcft_analysis.measurement_comparison:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dcft_analysis"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
