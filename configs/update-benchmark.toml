schema_version = 2

[campaign]
name = "update-benchmark-diagnostics-v2"
preset = "test"
seed = 6840227781351331448
output_root = "../artifacts/update-benchmark-diagnostics-v2"
project_root = ".."
scratch_root = "../scratch/update-benchmark-diagnostics-v2"

[lattice]
sizes = [8]
lt_factor = 2
regularization = "isotropic"

[protocols]
noises = ["z"]
p_values = [0.2]
measurements = ["heterodyne"]
gaussian_fractions = []

[mc]
enabled = true
outer_records = 16
clean_thermalization_sweeps = 500
clean_saving_interval = 20
posterior_decorrelation_gap = 32
inner_measurements = 64
inner_saving_interval = 2
updates = ["metropolis", "sequential-metropolis", "metropolis-global", "corrected-wolff", "tnmc", "tnmc-global"]
separations = "all"
inner_budget_multipliers = [1, 2, 4]
diagnostic_outer_records = 4
replicated_chains = 2
tnmc_bond_dimension = 8

[ed]
enabled = false
max_sites = 0
gaussian_outer_records = 0
local_x_enumeration_limit = 14
sampled_binary_records = 0
priors = ["finite-transfer"]
positivity_tolerance = 1e-11

[statistics]
bootstrap_resamples = 100
block_length = 2
confidence = 0.95

[execution]
mc_chunks = 2
local_workers = 8

[cluster]
scheduler = "slurm"
partition = "day"
account = "pi_mc2832"
time_limit = "00:30:00"
cpus_per_task = 8
memory = "4G"
