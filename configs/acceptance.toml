schema_version = 1

[campaign]
name = "acceptance-L4-L6-L8"
preset = "comparison"
seed = 11160318154034397263
output_root = "../artifacts/acceptance"
project_root = ".."
scratch_root = "../scratch/acceptance"

[lattice]
sizes = [4, 6, 8]
lt_factor = 4
regularization = "trotter"
