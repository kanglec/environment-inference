[statistics]
bootstrap_resamples = 500
block_length = 4
confidence = 0.95

[cluster]
scheduler = "slurm"
partition = "day"
account = "pi_mc2832"
time_limit = "02:00:00"
cpus_per_task = 1
memory = "8G"
max_array_concurrency = 32
use_modules = false
python_module = "Python/3.12.3-GCCcore-13.3.0"
