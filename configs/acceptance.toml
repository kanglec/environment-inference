[mc]
enabled = true
outer_records = 96
clean_thermalization_sweeps = 1000
clean_saving_interval = 30
posterior_decorrelation_gap = 100
inner_measurements = 128
inner_saving_interval = 4
updates = ["corrected-wolff", "tnmc"]
separations = "all"
inner_budget_multipliers = [1, 2, 4]
